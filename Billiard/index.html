<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Shooter Game</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            margin: auto;
            background: #111;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        canvas.width = 500;
        canvas.height = window.innerHeight;

        const spaceship = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 100,
            width: 50,
            height: 50,
            speed: 10
        };

        const bullets = [];
        const bossBullets = [];
        const chickens = [];
        const chickenSize = 40;
        const bulletSpeed = 7;
        const bossBulletSpeed = 5;
        let score = 0;
        let boss = null;
        let bossHealth = 100;
        let bossLevel = 1;

        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + 5 > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + 20 > obj2.y;
        }

        function drawSpaceship() {
            ctx.fillStyle = "#0f0";
            ctx.fillRect(spaceship.x, spaceship.y, spaceship.width, spaceship.height);
        }

        function drawBullet(bullet) {
            ctx.fillStyle = "#f00";
            ctx.fillRect(bullet.x, bullet.y, 5, 20);
        }

        function drawBossBullet(bullet) {
            ctx.fillStyle = "#f06";
            ctx.fillRect(bullet.x, bullet.y, 5, 20);
        }

        function drawChicken(chicken) {
            ctx.fillStyle = "#ff0";
            ctx.fillRect(chicken.x, chicken.y, chickenSize, chickenSize);
        }

        function drawBoss() {
            ctx.fillStyle = "#f06";
            ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
            ctx.fillStyle = "red";
            ctx.fillRect(boss.x, boss.y - 20, boss.width * (bossHealth / (100 * bossLevel)), 10);
        }

        function spawnBoss() {
            boss = { x: canvas.width / 2 - 50, y: 50, width: 100, height: 100 };
            bossHealth = 100 * bossLevel;
        }

        function shootBullet() {
            const bullet = { x: spaceship.x + spaceship.width / 2 - 2.5, y: spaceship.y };
            bullets.push(bullet);
        }

        function bossShoot() {
            if (boss) {
                const bullet = { x: boss.x + boss.width / 2 - 2.5, y: boss.y + boss.height };
                bossBullets.push(bullet);
            }
        }

        setInterval(shootBullet, 100);
        setInterval(bossShoot, 500);

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawSpaceship();

            bullets.forEach((bullet, index) => {
                bullet.y -= bulletSpeed;
                drawBullet(bullet);
                if (boss && checkCollision(bullet, boss)) {
                    bullets.splice(index, 1);
                    bossHealth -= 10;
                    if (bossHealth <= 0) {
                        score += 50;
                        boss = null;
                        bossLevel++;
                    }
                }
            });

            bossBullets.forEach((bullet, index) => {
                bullet.y += bossBulletSpeed;
                drawBossBullet(bullet);
                if (bullet.y > canvas.height) bossBullets.splice(index, 1);
                if (checkCollision(bullet, spaceship)) {
                    alert("Game Over! Final Score: " + score);
                    document.location.reload();
                }
            });

            if (!boss && score >= bossLevel * 100) spawnBoss();
            if (boss) drawBoss();

            scoreDisplay.textContent = "Score: " + score;
        }

        function gameLoop() {
            updateGame();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" && spaceship.x > 0) spaceship.x -= spaceship.speed;
            if (e.key === "ArrowRight" && spaceship.x < canvas.width - spaceship.width) spaceship.x += spaceship.speed;
        });

        gameLoop();
    </script>
</body>
</html>
